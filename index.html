<script>
"use strict";

/* =========================================
ECO 1.0
Answers come from the web. A tiny AI that runs
in your browser picks the answer most sources
agree on. No big AI servers.
========================================= */

const conversation = document.getElementById("conversation");
const input = document.getElementById("userInput");
const welcome = document.getElementById("welcome");

let waitingIndex = 0;
let timerInterval = null;
let timerEndTime = null;
let requestNumber = 0;

/* =========================================
ROTATING WELCOME TEXT
========================================= */

const waitingMessages = [
    "How can I help you?",
    "Go ahead, Iâm listening.",
    "You can type on the line below."
];

setInterval(() => {
    welcome.classList.remove("swipe-in");
    welcome.classList.add("swipe");

    setTimeout(() => {
        waitingIndex = (waitingIndex + 1) % waitingMessages.length;
        welcome.textContent = waitingMessages[waitingIndex];

        welcome.classList.remove("swipe");
        void welcome.offsetWidth;
        welcome.classList.add("swipe-in");
    }, 300);
}, 4000);

/* =========================================
MESSAGE HELPERS
Text is inserted safely instead of being
interpreted as HTML.
========================================= */

function scrollDown() {
    conversation.scrollTop = conversation.scrollHeight;
}

function createMessage(sender) {
    const message = document.createElement("div");
    message.className = "message";

    const senderElement = document.createElement("div");
    senderElement.className = "sender";
    senderElement.textContent = sender;

    const textElement = document.createElement("div");
    textElement.className = "messageText";

    message.append(senderElement, textElement);
    conversation.appendChild(message);

    return { message, textElement };
}

function addUserMessage(text) {
    const { textElement } = createMessage("You");
    textElement.textContent = text;
    scrollDown();
}

function addEcoMessage(text) {
    const { textElement } = createMessage("Eco");
    textElement.textContent = String(text);
    scrollDown();
}

function addEcoLinkMessage(prefix, label, url) {
    const { textElement } = createMessage("Eco");

    textElement.appendChild(document.createTextNode(prefix));

    const link = document.createElement("a");
    link.className = "searchLink";
    link.textContent = label;
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    textElement.appendChild(link);
    scrollDown();
}

function addEcoRichMessage(parts) {
    const { textElement } = createMessage("Eco");

    for (const part of parts) {
        if (part.type === "link") {
            const link = document.createElement("a");
            link.className = "searchLink";
            link.textContent = part.label;
            link.href = part.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            textElement.appendChild(link);
        } else {
            textElement.appendChild(document.createTextNode(part.text));
        }
    }

    scrollDown();
}

function addThinking() {
    removeThinking();

    const { message, textElement } = createMessage("Eco");
    message.id = "thinkingMessage";
    textElement.className = "thinking";
    textElement.textContent = "â¦";

    scrollDown();
}

function removeThinking() {
    const thinking = document.getElementById("thinkingMessage");

    if (thinking) {
        thinking.remove();
    }
}

/* =========================================
NORMALIZE COMMANDS
========================================= */

function normalize(text) {
    return text
        .toLocaleLowerCase()
        .trim()
        .replace(/[?!.,]+$/g, "")
        .trim()
        .replace(/\s+/g, " ");
}

/* =========================================
RANDOM NUMBER
========================================= */

function randomNumber() {
    return Math.floor(Math.random() * 100) + 1;
}

/* =========================================
CALCULATOR
========================================= */

function calculateExpression(expression) {
    const cleaned = expression
        .replace(/,/g, "")
        .trim();

    if (!cleaned || cleaned.length > 100) {
        return null;
    }

    /*
    Permit only numeric arithmetic characters.
    The expression is evaluated only after this
    strict character check.
    */

    if (!/^[0-9+\-*/().%\s]+$/.test(cleaned)) {
        return null;
    }

    /*
    Convert percentage values such as 50% into
    50/100. This supports simple percentages,
    not every possible interpretation of %.
    */

    const converted = cleaned.replace(
        /(\d+(?:\.\d+)?)\s*%/g,
        "($1/100)"
    );

    try {
        const result = Function(
            '"use strict"; return (' + converted + ');'
        )();

        if (
            typeof result !== "number" ||
            !Number.isFinite(result)
        ) {
            return null;
        }

        return Number(result.toPrecision(12));
    } catch {
        return null;
    }
}

function tryMath(command) {
    let expression = command;

    expression = expression
        .replace(/^calculate\s+/i, "")
        .replace(/^what is\s+/i, "")
        .replace(/^what's\s+/i, "")
        .replace(/\bplus\b/gi, "+")
        .replace(/\bminus\b/gi, "-")
        .replace(/\btimes\b/gi, "*")
        .replace(/\bmultiplied by\b/gi, "*")
        .replace(/\bdivided by\b/gi, "/")
        .replace(/\bx\b/gi, "*")
        .trim();

    if (!/[0-9]/.test(expression)) {
        return false;
    }

    const result = calculateExpression(expression);

    if (result === null) {
        return false;
    }

    addEcoMessage("The answer is " + result + ".");
    return true;
}

/* =========================================
TIMER
========================================= */

function startTimer(minutes) {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    const oldTimer = document.getElementById("timerMessage");

    if (oldTimer) {
        oldTimer.remove();
    }

    timerEndTime = Date.now() + minutes * 60 * 1000;

    const { message, textElement } = createMessage("Eco");
    message.id = "timerMessage";

    textElement.textContent =
        "Timer set for " +
        minutes +
        " minute" +
        (minutes === 1 ? "" : "s") +
        ".";

    const display = document.createElement("div");
    display.id = "timerDisplay";
    display.className = "timerDisplay";
    display.textContent = minutes + ":00";

    message.appendChild(display);
    scrollDown();

    updateTimer();
    timerInterval = setInterval(updateTimer, 250);
}

function updateTimer() {
    if (timerEndTime === null) {
        return;
    }

    const remaining = Math.max(0, timerEndTime - Date.now());
    const totalSeconds = Math.ceil(remaining / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const display = document.getElementById("timerDisplay");

    if (display) {
        display.textContent =
            minutes + ":" + String(seconds).padStart(2, "0");
    }

    if (remaining <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerEndTime = null;

        if (display) {
            display.textContent = "0:00";
        }

        addEcoMessage("Your timer is done!");

        if ("Notification" in window) {
            if (Notification.permission === "granted") {
                new Notification("Eco", {
                    body: "Your timer is done!"
                });
            }
        }
    }
}

function cancelTimer() {
    if (!timerInterval) {
        return false;
    }

    clearInterval(timerInterval);
    timerInterval = null;
    timerEndTime = null;

    const timer = document.getElementById("timerMessage");

    if (timer) {
        timer.remove();
    }

    addEcoMessage("Timer cancelled.");
    return true;
}

/* =========================================
DATE AND TIME
========================================= */

function getDate() {
    return new Date().toLocaleDateString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    });
}

function getTime() {
    return new Date().toLocaleTimeString(undefined, {
        hour: "numeric",
        minute: "2-digit"

}

function getGreeting() {
    const hour = new Date().getHours();

    if (hour < 12) {
        return "Good morning!";
    }

    if (hour < 17) {
        return "Good afternoon!";
    }

    return "Good evening!";
}

/* =========================================
UNIT CONVERSIONS
========================================= */

function tryConversion(command) {
    let match;
    let value;
    let result;

    match = command.match(
        /([\d.]+)\s*(miles?|mi)\s*(?:to|in)\s*(kilometers?|km)/
    );

    if (match) {
        value = Number(match[1]);
        result = value * 1.609344;

        addEcoMessage(
            value + " miles is " +
            result.toFixed(2) + " kilometers."
        );

        return true;
    }

    match = command.match(
        /([\d.]+)\s*(kilometers?|km)\s*(?:to|in)\s*(miles?|mi)/
    );

    if (match) {
        value = Number(match[1]);
        result = value / 1.609344;

        addEcoMessage(
            value + " kilometers is " +
            result.toFixed(2) + " miles."
        );

        return true;
    }

    match = command.match(
        /([\d.]+)\s*(?:degrees?\s*)?(?:fahrenheit|Â°f)\s*(?:to|in)\s*(?:celsius|Â°c)/
    );

    if (match) {
        value = Number(match[1]);
        result = (value - 32) * 5 / 9;

        addEcoMessage(
            value + "Â°F is " +
            result.toFixed(1) + "Â°C."
        );

        return true;
    }

    match = command.match(
        /([\d.]+)\s*(?:degrees?\s*)?(?:celsius|Â°c)\s*(?:to|in)\s*(?:fahrenheit|Â°f)/
    );

    if (match) {
        value = Number(match[1]);
        result = value * 9 / 5 + 32;

        addEcoMessage(
            value + "Â°C is " +
            result.toFixed(1) + "Â°F."
        );

        return true;
    }

    match = command.match(
        /([\d.]+)\s*(pounds?|lbs?)\s*(?:to|in)\s*(kilograms?|kg)/
    );

    if (match) {
        value = Number(match[1]);
        result = value * 0.45359237;

        addEcoMessage(
            value + " pounds is " +
            result.toFixed(2) + " kilograms."
        );

        return true;
    }

    match = command.match(
        /([\d.]+)\s*(kilograms?|kg)\s*(?:to|in)\s*(pounds?|lbs?)/
    );

    if (match) {
        value = Number(match[1]);
        result = value / 0.45359237;

        addEcoMessage(
            value + " kilograms is " +
            result.toFixed(2) + " pounds."
        );

        return true;
    }

    match = command.match(
        /([\d.]+)\s*(inches?|in)\s*(?:to|in)\s*(centimeters?|cm)/
    );

    if (match) {
        value = Number(match[1]);
        result = value * 2.54;

        addEcoMessage(
            value + " inches is " +
            result.toFixed(2) + " centimeters."
        );

        return true;
    }

    match = command.match(
        /([\d.]+)\s*(centimeters?|cm)\s*(?:to|in)\s*(inches?|in)/
    );

    if (match) {
        value = Number(match[1]);
        result = value / 2.54;

        addEcoMessage(
            value + " centimeters is " +
            result.toFixed(2) + " inches."
        );

        return true;
    }

    return false;
}

function getPosition() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject(new Error("No location"));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            p => resolve(p.coords),
            reject,
            { timeout: 10000, maximumAge: 600000 }
        );
    });
}

/* =========================================
DAYS UNTIL A DATE
========================================= */

function tryDaysUntil(command) {
    const match = command.match(
        /^how many days (?:until|till)\s+(.+)$/
    );

    if (!match) {
        return false;
    }

    const target = new Date(match[1]);

    if (Number.isNaN(target.getTime())) {
        return false;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    target.setHours(0, 0, 0, 0);

    const difference = Math.round(
        (target - today) / 86400000
    );

    if (difference < 0) {
        addEcoMessage("That date has already passed.");
    } else if (difference === 0) {
        addEcoMessage("That date is today! âï¸");
    } else if (difference === 1) {
        addEcoMessage("That date is tomorrow!");
    } else {
        addEcoMessage(
            "There are " + difference +
            " days until " +
            target.toLocaleDateString(undefined, {
                month: "long",
                day: "numeric",
                year: "numeric"
            }) + "."
        );
    }

    return true;
}

/* =========================================
ECO ANSWERS
1. The site's helper searches the web (Bing +
   Wikipedia) and reads the top pages.
2. A tiny AI in your browser (all-MiniLM-L6-v2,
   about 23 MB, cached after the first time) turns
   every sentence into numbers that capture meaning.
3. Each sentence scores high when it matches the
   question AND many different sites say the same
   thing. The winner is Eco's answer.
If the tiny AI can't load, Eco compares words instead.
========================================= */

let brain = null;
let brainState = "idle"; // idle | loading | ready | failed
let brainWaiters = [];
let brainJobs = new Map();
let brainJobId = 0;
let brainNoticeShown = false;

function startBrain() {
    if (brain || brainState === "failed") return;

    try {
        const BRAIN_SRC = `// Eco's tiny brain: a ~23 MB sentence-meaning model that runs
// entirely in your browser (cached after the first download).
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

env.allowLocalModels = false;
env.useBrowserCache = true;

let extractor = null;

async function load() {
    if (extractor) return extractor;
    extractor = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", { quantized: true });
    return extractor;
}

self.onmessage = async (event) => {
    const m = event.data || {};

    if (m.type === "load") {
        try {
            await load();
            self.postMessage({ type: "ready" });
        } catch (error) {
            self.postMessage({
                type: "failed",
                error: String(error && error.message || error)
            });
        }
    } else if (m.type === "embed") {
        try {
            const ex = await load();
            const vectors = [];

            for (let i = 0; i < m.texts.length; i += 24) {
                const batch = m.texts.slice(i, i + 24);
                const out = await ex(batch, {
                    pooling: "mean",
                    normalize: true
                });

                const dim = out.dims[out.dims.length - 1];

                for (let k = 0; k < batch.length; k++) {
                    vectors.push(
                        Array.from(
                            out.data.subarray(k * dim, (k + 1) * dim)
                        )
                    );
                }
            }

            self.postMessage({
                type: "embedded",
                id: m.id,
                vectors
            });
        } catch (error) {
            self.postMessage({
                type: "failed",
                error: String(error && error.message || error)
            });
        }
    }
};`;

        brain = new Worker(
            URL.createObjectURL(
                new Blob([BRAIN_SRC], { type: "text/javascript" })
            ),
            { type: "module" }
        );

        brainState = "loading";

        brain.onmessage = (event) => {
            const m = event.data || {};

            if (m.type === "ready") {
                brainState = "ready";
                brainWaiters.splice(0).forEach(w => w(true));
            } else if (m.type === "failed") {
                brainState = "failed";
                brainWaiters.splice(0).forEach(w => w(false));
                brainJobs.forEach(j => j.reject(new Error("brain failed")));
                brainJobs.clear();
            } else if (m.type === "embedded") {
                const job = brainJobs.get(m.id);

                if (job) {
                    brainJobs.delete(m.id);
                    job.resolve(m.vectors);
                }
            }
        };

        brain.onerror = () => {
            brainState = "failed";
            brainWaiters.splice(0).forEach(w => w(false));
            brainJobs.forEach(j => j.reject(new Error("brain failed")));
            brainJobs.clear();
        };

        brain.postMessage({ type: "load" });
    } catch (error) {
        brainState = "failed";
    }
}

function waitForBrain(ms) {
    if (brainState === "ready") return Promise.resolve(true);
    if (brainState !== "loading") return Promise.resolve(false);

    return new Promise(resolve => {
        const t = setTimeout(() => resolve(false), ms);
        brainWaiters.push(ok => {
            clearTimeout(t);
            resolve(ok);
        });
    });
}

function embed(texts) {
    return new Promise((resolve, reject) => {
        const id = ++brainJobId;
        brainJobs.set(id, { resolve, reject });
        brain.postMessage({ type: "embed", id, texts });

        setTimeout(() => {
            if (brainJobs.has(id)) {
                brainJobs.delete(id);
                reject(new Error("brain timeout"));
            }
        }, 30000);
    });
}

/* Start downloading the tiny brain once someone
   starts typing, so first-time visitors who never
   ask anything don't download it at all. */

input.addEventListener("focus", startBrain, { once: true });
input.addEventListener("keydown", startBrain, { once: true });


/* =========================================
ECO'S TINY WRITER
After the tiny brain picks the best sentences,
a second small AI (LaMini-Flan-T5-77M, about
95 MB, cached after the first time) reads the
top few and writes a short answer in its own
words. It only downloads after your first real
question, runs in its own worker so the page
never freezes, and if it fails, is too slow, or
writes something odd, Eco shows the picked
sentence instead.
========================================= */

const WRITER_TIMEOUT = 20000;

let writer = null;
let writerState = "idle"; // idle | loading | ready | failed
let writerWaiters = [];
let writerJobs = new Map();
let writerJobId = 0;
let writerStrikes = 0;
let writerFiles = {};
let writerWaitedOnce = false;

function writerPercent() {
    let loaded = 0;
    let total = 0;

    for (const f of Object.values(writerFiles)) {
        loaded += f.loaded || 0;
        total += f.total || 0;
    }

    return total > 50e6 ? Math.min(99, Math.floor(loaded / total * 100)) : null;
}

function writerDown(reason) {
    if (writer) {
        try { writer.terminate(); } catch (e) {}
    }

    writer = null;
    writerStrikes++;
    writerState = writerStrikes >= 2 ? "failed" : "idle";
    writerWaiters.splice(0).forEach(w => w(false));
    writerJobs.forEach(j => j.reject(new Error(reason || "writer failed")));
    writerJobs.clear();
}

function startWriter() {
    if (writer || writerState === "failed") return;

    try {
        const WRITER_SRC = `// Eco's tiny writer: LaMini-Flan-T5-77M (~95 MB, cached
// after the first download), running entirely in your browser.
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

env.allowLocalModels = false;
env.useBrowserCache = true;
try { env.backends.onnx.logLevel = "error"; } catch (e) {}

let loading = null;

function load() {
    if (!loading) {
        loading = pipeline("text2text-generation", "Xenova/LaMini-Flan-T5-77M", {
            quantized: true,
            progress_callback: (p) => {
                if (p && p.status === "progress") {
                    self.postMessage({ type: "progress", file: p.file, loaded: p.loaded, total: p.total });
                }
            }
        });
        loading.catch(() => { loading = null; });
    }
    return loading;
}

function buildPrompt(tok, question, facts) {
    const head = "Answer the question in 1-2 short sentences using only these facts.\\nQuestion: " + question + "\\nFacts:";
    const tail = "\\nAnswer:";
    let used = [];

    for (const f of facts) {
        const next = head + " " + used.concat([f]).join(" ") + tail;
        if (used.length && tok.encode(next).length > 480) break;
        used.push(f);
    }

    return head + " " + used.join(" ") + tail;
}

self.onmessage = async (event) => {
    const m = event.data || {};

    if (m.type === "load") {
        try {
            await load();
            self.postMessage({ type: "ready" });
        } catch (error) {
            self.postMessage({ type: "failed", error: String(error && error.message || error) });
        }
    } else if (m.type === "write") {
        try {
            const gen = await load();
            const prompt = buildPrompt(gen.tokenizer, m.question, m.facts);
            const t0 = performance.now();
            const out = await gen(prompt, {
                max_new_tokens: 60,
                do_sample: false,
                num_beams: 1,
                no_repeat_ngram_size: 3,
                ...(m.opts || {})
            });
            self.postMessage({
                type: "written",
                id: m.id,
                text: (out && out[0] && out[0].generated_text) || "",
                ms: Math.round(performance.now() - t0)
            });
        } catch (error) {
            self.postMessage({ type: "writeError", id: m.id, error: String(error && error.message || error) });
        }
    }
};`;

        writer = new Worker(
            URL.createObjectURL(
                new Blob([WRITER_SRC], { type: "text/javascript" })
            ),
            { type: "module" }
        );

        writerState = "loading";

        writer.onmessage = (event) => {
            const m = event.data || {};

            if (m.type === "progress") {
                writerFiles[m.file] = { loaded: m.loaded, total: m.total };
                const pct = writerPercent();

                if (pct !== null) {
                    setThinkingText("Eco is writingâ¦ (getting the writer ready, " + pct + "%, only the first time)");
                }
            } else if (m.type === "ready") {
                writerState = "ready";
                writerWaiters.splice(0).forEach(w => w(true));
            } else if (m.type === "failed") {
                console.warn("Eco writer failed to load:", m.error);
                writerDown("load failed");
                writerState = "failed";
            } else if (m.type === "written" || m.type === "writeError") {
                const job = writerJobs.get(m.id);

                if (job) {
                    writerJobs.delete(m.id);

                    if (m.type === "written") {
                        job.resolve(m);
                    } else {
                        job.reject(new Error(m.error));
                    }
                }
            }
        };

        writer.onerror = (e) => {
            console.warn("Eco writer error:", e && e.message);
            writerDown("worker error");
        };

        writer.postMessage({ type: "load" });
    } catch (error) {
        writerState = "failed";
    }
}

function waitForWriter(ms) {
    if (writerState === "ready") return Promise.resolve(true);
    if (writerState !== "loading") return Promise.resolve(false);

    return new Promise(resolve => {
        const t = setTimeout(() => resolve(false), ms);
        writerWaiters.push(ok => {
            clearTimeout(t);
            resolve(ok);
        });
    });
}

function writeWithWriter(question, facts, opts) {
    return new Promise((resolve, reject) => {
        const id = ++writerJobId;
        writerJobs.set(id, { resolve, reject });
        writer.postMessage({ type: "write", id, question, facts, opts });

        setTimeout(() => {
            if (writerJobs.has(id)) {
                /* Too slow on this device: stop it so it
                   doesn't keep the computer busy. Two
                   strikes and Eco stops using the writer. */
                writerDown("writer timeout");
                reject(new Error("writer timeout"));
            }
        }, WRITER_TIMEOUT);
    });
}

function editDistance(a, b) {
    const row = Array.from({ length: b.length + 1 }, (_, i) => i);

    for (let i = 1; i <= a.length; i++) {
        let prev = row[0];
        row[0] = i;

        for (let j = 1; j <= b.length; j++) {
            const keep = row[j];
            row[j] = Math.min(
                row[j] + 1,
                row[j - 1] + 1,
                prev + (a[i - 1] === b[j - 1] ? 0 : 1)
            );
            prev = keep;
        }
    }

    return row[b.length];
}

/* Checks the writer's answer. Anything empty,
   repetitive, garbled, off-topic, or with numbers
   the facts don't contain is thrown away. */

function checkSummary(raw, facts, question) {
    let t = String(raw || "")
        .replace(/<\/?s>|<pad>|<unk>/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/^(answer|eco)\s*:\s*/i, "");

    if (!t) return null;

    if (!/[.!?]$/.test(t)) {
        const end = Math.max(t.lastIndexOf(". "), t.lastIndexOf("! "), t.lastIndexOf("? "));

        if (end > 20) {
            t = t.slice(0, end + 1);
        } else {
            t = t.replace(/[,;:\s]+$/, "") + ".";
        }
    }

    t = splitSentences(t).slice(0, 2).join(" ");
    t = t.charAt(0).toUpperCase() + t.slice(1);

    const w = words(t);

    if (w.length < 3 || w.length > 70) return null;

    const odd = t.match(/[^\x20-\x7E\u00A0-\u024F\u2018-\u201F\u2013\u2014\u2026Â°]/g) || [];

    if (odd.length > 2) return null;
    if (/(.)\1{4,}/.test(t)) return null;

    if (w.length >= 8 && new Set(w).size / w.length < 0.55) return null;

    const grams = new Set();

    for (let i = 0; i + 2 < w.length; i++) {
        const g = w[i] + " " + w[i + 1] + " " + w[i + 2];

        if (grams.has(g)) return null;
        grams.add(g);
    }

    if (/\b(i'?m sorry|i am sorry|as an ai|i don'?t know|i do not know|i cannot|i can'?t|not (mentioned|provided|specified|given|clear)|no information|does not (say|mention|provide|specify)|the facts|these facts|the question)\b/i.test(t)) {
        return null;
    }

    const factText = facts.join(" ");
    const factWords = new Set(words(factText));
    const kw = keywords(t);

    if (!kw.length) return null;

    const shared = kw.filter(x => factWords.has(x));

    if (shared.length / kw.length < 0.6) return null;

    const qk = new Set(keywords(question));

    if (!shared.some(x => !qk.has(x))) return null;

    /* Garbled words: a new word that is a near-miss
       of a word in the facts ("bebee" for "bee",
       "Epis" for "Apis") means the writer stumbled. */

    const qWords = new Set(words(question));

    for (const x of new Set(words(t))) {
        if (factWords.has(x) || qWords.has(x) || /\d/.test(x)) continue;

        if (/^([a-z]{2,3})\1/.test(x)) return null;

        if (x.length < 4 || STOP.has(x)) continue;

        for (const f of factWords) {
            if (f.length < 4 || STOP.has(f)) continue;
            if (f.startsWith(x.slice(0, -1)) || x.startsWith(f.slice(0, -1))) continue;

            if (editDistance(x, f) <= (x.length <= 6 ? 1 : 2)) {
                return null;
            }
        }
    }

    const factDigits = factText.replace(/(\d),(?=\d)/g, "$1");
    const qDigits = question.replace(/(\d),(?=\d)/g, "$1");

    for (const n of t.match(/\d[\d,.]*/g) || []) {
        const clean = n.replace(/[.,]+$/, "").replace(/,/g, "");

        if (!factDigits.includes(clean) && !qDigits.includes(clean)) {
            return null;
        }
    }

    return t;
}

async function writeSummary(question, answer) {
    if (!answer.facts || !answer.facts.length) {
        return { text: null, why: "no facts" };
    }

    startWriter();

    if (writerState !== "ready") {
        const pct = writerPercent();

        setThinkingText(
            "Eco is writingâ¦ (getting the writer ready" +
            (pct !== null ? ", " + pct + "%" : "") +
            ", only the first time)"
        );

        /* Wait for the download once; if it's a slow
           connection, later questions don't wait again
           and get the picked sentence until it's ready. */

        const ok = await waitForWriter(writerWaitedOnce ? 1500 : 15000);
        writerWaitedOnce = true;

        if (!ok) {
            return {
                text: null,
                why: writerState === "loading" ? "still downloading" : "writer unavailable"
            };
        }
    }

    setThinkingText("Eco is writingâ¦");

    try {
        const out = await writeWithWriter(question, answer.facts);
        const text = checkSummary(out.text, answer.facts, question);

        return {
            text,
            raw: out.text,
            ms: out.ms,
            why: text ? "ok" : "rejected"
        };
    } catch (error) {
        return { text: null, why: String(error && error.message || error) };
    }
}

const STOP = new Set((
    "a an the of to in on at for by with from and or but is are was were be been being am do does did " +
    "what who whom whose which when where why how many much is it its it's this that these those there their they them " +
    "he she his her him you your i me my we our us can could would should will shall may might must " +
    "about into over than then so as if not no yes up out just also very more most some any all each " +
    "tell give show find please know explain define meaning mean called name"
).split(" "));

const JUNK = /cookie|subscribe|sign up|sign in|log in|newsletter|advertis|privacy policy|terms of (use|service)|all rights reserved|Â©|javascript|your browser|click here|read more|download the app|follow us|share this|affiliate|we may earn|getty images|\bphoto:|image credit/i;

const NUMBER_VALUES = {
    one: "1",
    two: "2",
    three: "3",
    four: "4",
    five: "5",
    six: "6",
    seven: "7",
    eight: "8",
    nine: "9",
    ten: "10",
    eleven: "11",
    twelve: "12",
    twenty: "20",
    hundred: "100",
    thousand: "1000"
};

const NUMBER_WORDS = /\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|hundred|thousand|million|billion)\b/i;

function words(text) {
    return (text.toLowerCase().match(/[a-z0-9]+(?:['â][a-z]+)?/g) || [])
        .map(w => w.replace(/['â]s$/, ""))
        .map(w => (
            w.length > 4 &&
            w.endsWith("s") &&
            !w.endsWith("ss")
        ) ? w.slice(0, -1) : w);
}

function keywords(text) {
    return words(text).filter(w => !STOP.has(w) && w.length > 1);
}

function splitSentences(text) {
    return text
        .replace(/\s*\n+\s*/g, "\n")
        .split(/\n|(?<=[.!?])\s+(?=["â(]?[A-Z0-9])/)
        .map(s => s.trim())
        .filter(Boolean);
}

function cleanSentence(s) {
    s = s
        .replace(/\s*\(([^()]*)\)/g, (m, inner) => (
            /[\/;ËËâ]|listen|pronounc|^\s*[,;]?\s*$/i.test(inner)
                ? ""
                : m
        ))
        .replace(/\[\d+\]|\[citation needed\]/g, "")
        .replace(/^[A-Z][a-z]{2} \d{1,2}, \d{4}\s*[Â·-]\s*/, "")
        .replace(/\s*(â¦|\.\.\.)$/, "")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/^(the )?(short |quick |simple )?answer( is)?:\s*/i, "")
        .replace(/^(but|and|so|also|however|in fact|yes|well|actually|basically),?\s+/i, "");

    return s.charAt(0).toUpperCase() + s.slice(1);
}

/* A snippet cut off mid-sentence gets trimmed
   back to its last complete clause. */

function trimCut(s) {
    if (/[.!?"â)]$/.test(s)) return s;

    const comma = s.lastIndexOf(",");

    if (comma > s.length * 0.5) {
        return s.slice(0, comma);
    }

    const parts = s.split(" ");

    while (
        parts.length > 5 &&
        /^(which|that|is|are|was|were|the|a|an|and|or|of|to|in|on|at|for|with|by|its|their|it|as|from|but)$/i.test(parts[parts.length - 1])
    ) {
        parts.pop();
    }

    return parts.join(" ");
}

function buildCandidates(question, sources) {
    const qk = new Set(keywords(question));
    const out = [];

    sources.forEach((src, si) => {
        const pieces = [];

        for (const s of splitSentences(src.text || "")) {
            pieces.push({ text: s, snippet: false });
        }

        for (const s of splitSentences(src.snippet || "")) {
            pieces.push({ text: s, snippet: true });
        }

        const seen = new Set();
        const mine = [];

        for (const p of pieces) {
            let text = cleanSentence(p.text);

            if (/^(what|how|why|who|when|where|which)\b/i.test(text) && text.length < 70) {
                continue;
            }

            if (p.snippet) {
                text = trimCut(text);
            }

            const n = words(text).length;

            if (text.length < 25 || text.length > 360 || n < 5) continue;
            if (JUNK.test(text)) continue;
            if (/[{}<>|]/.test(text)) continue;
            if (/\?$/.test(text)) continue;

            const key = text.toLowerCase().slice(0, 80);

            if (seen.has(key)) continue;

            seen.add(key);

            const kw = keywords(text);
            let hits = 0;

            for (const w of new Set(kw)) {
                if (qk.has(w)) hits++;
            }

            mine.push({
                text,
                source: si,
                kw,
                hits,
                snippet: p.snippet,
                complete: /[.!]$/.test(p.text.trim())
            });
        }

        mine.sort((a, b) => b.hits - a.hits);
        out.push(...mine.slice(0, 14));
    });

    out.sort((a, b) => b.hits - a.hits);
    return out.slice(0, 110);
}

/* Simple word vectors for when the tiny AI isn't there. */

function wordVectors(texts) {
    const df = new Map();

    const docs = texts.map(t => {
        const tf = new Map();

        for (const w of keywords(t)) {
            tf.set(w, (tf.get(w) || 0) + 1);
        }

        for (const w of tf.keys()) {
            df.set(w, (df.get(w) || 0) + 1);
        }

        return tf;
    });

    const N = texts.length;

    return docs.map(tf => {
        const v = new Map();
        let norm = 0;

        for (const [w, c] of tf) {
            const x = (1 + Math.log(c)) * Math.log(1 + N / df.get(w));
            v.set(w, x);
            norm += x * x;
        }

        norm = Math.sqrt(norm) || 1;

        for (const [w, x] of v) {
            v.set(w, x / norm);
        }

        return v;
    });
}

function simWords(a, b) {
    let s = 0;
    const [small, big] = a.size < b.size ? [a, b] : [b, a];

    for (const [w, x] of small) {
        const y = big.get(w);

        if (y) {
            s += x * y;
        }
    }

    return s;
}

function simDense(a, b) {
    let s = 0;

    for (let i = 0; i < a.length; i++) {
        s += a[i] * b[i];
    }

    return s;
}

/* Answer words: numbers and names that aren't in the question.
   The ones that show up on the most different sites win the vote. */

function answerTokens(text, qWords) {
    const tokens = new Set();
    const nums = text.match(/\b\d[\d,.]*\b/g) || [];

    for (const n of nums) {
        const clean = n.replace(/[,.]$/, "").replace(/,/g, "");

        if (clean.length && !qWords.has(clean)) {
            tokens.add("#" + clean);
        }
    }

    const spelled = text.match(new RegExp(NUMBER_WORDS.source, "gi")) || [];

    for (const n of spelled) {
        const w = n.toLowerCase();

        if (!qWords.has(w)) {
            tokens.add("#" + (NUMBER_VALUES[w] || w));
        }
    }

    const caps = text.match(/\b[A-Z][a-zA-Zâ'-]{2,}\b/g) || [];

    for (const c of caps) {
        const w = words(c)[0];

        if (w && !STOP.has(w) && !qWords.has(w)) {
            tokens.add(w);
        }
    }

    return tokens;
}

async function rankAnswer(question, sources, useBrain) {
    const cands = buildCandidates(question, sources);

    if (!cands.length) return null;

    const texts = [question, ...cands.map(c => c.text)];
    let vecs;
    let sim;
    let method;

    if (useBrain) {
        try {
            vecs = await embed(texts);
            sim = simDense;
            method = "tiny-ai";
        } catch (error) {
            vecs = null;
        }
    }

    if (!vecs) {
        vecs = wordVectors(texts);
        sim = simWords;
        method = "word-match";
    }

    const q = vecs[0];
    const v = vecs.slice(1);
    const nSources = new Set(cands.map(c => c.source)).size;
    const agreeAt = method === "tiny-ai" ? 0.62 : 0.28;

    cands.forEach((c, i) => {
        c.rel = Math.max(0, sim(q, v[i]));
    });

    const rels = cands.map(c => c.rel).sort((a, b) => b - a);
    const relCut = rels[Math.min(rels.length - 1, Math.floor(rels.length * 0.4))];
    const qWords = new Set(words(question));
    const ql = question.toLowerCase();

    const wantsNumber =
        /\b(how (many|much|old|tall|far|long|big|high|deep|wide|fast|heavy|hot|cold)|what year|when|what is the (population|height|distance|age|temperature|boiling|melting|speed|weight|price|cost))\b/.test(ql);

    const wantsName =
        !wantsNumber && /^(who|which|what is the (name|capital))\b/.test(ql);

    const votes = new Map();

    cands.forEach(c => {
        c.tokens = answerTokens(c.text, qWords);

        if (c.rel < relCut) return;

        for (const t of c.tokens) {
            if (!votes.has(t)) {
                votes.set(t, new Set());
            }

            votes.get(t).add(c.source);
        }
    });

    cands.forEach((c, i) => {
        const best = new Map();

        cands.forEach((d, j) => {
            if (d.source === c.source) return;

            const s = sim(v[i], v[j]);

            if (s > (best.get(d.source) || 0)) {
                best.set(d.source, s);
            }
        });

        let agree = 0;
        c.agreeing = [];

        for (const [src, s] of best) {
            if (s >= agreeAt) {
                agree += s;
                c.agreeing.push(src);
            }
        }

        c.agree = nSources > 1 ? agree / (nSources - 1) : 0;

        let vote = 0;

        for (const t of c.tokens) {
            const n = votes.has(t) ? votes.get(t).size : 0;

            if (n >= 2) {
                vote = Math.max(vote, n / nSources);
            }
        }

        c.vote = vote;

        let kind = 1;

        if (wantsNumber) {
            kind = (/\d/.test(c.text) || NUMBER_WORDS.test(c.text)) ? 1.25 : 0.55;
        } else if (wantsName) {
            kind = [...c.tokens].some(t => t[0] !== "#") ? 1.1 : 0.7;
        }

        const lengthPenalty = c.text.length > 240 ? 0.85 : 1;
        const partial = c.complete ? 1 : (c.snippet ? 0.9 : 0.6);

        let direct = 1;

        if (sources[c.source] && sources[c.source].direct) {
            const confirmed = [...c.tokens].some(
                t => votes.has(t) &&
                [...votes.get(t)].some(s => s !== c.source)
            );

            direct = confirmed ? 2 : 1.3;
        }

        c.score =
            Math.pow(c.rel, 1.5) *
            (0.35 + c.agree) *
            (0.7 + vote) *
            kind *
            lengthPenalty *
            partial *
            direct;
    });

    const ranked = [...cands].sort((a, b) => b.score - a.score);
    const top = ranked[0];

    if (!top || top.rel < (method === "tiny-ai" ? 0.25 : 0.05)) {
        return null;
    }

    const picked = [top];

    for (const c of ranked.slice(1, 12)) {
        if (picked.length >= 2) break;
        if (c.score < top.score * 0.75) break;

        const i = cands.indexOf(c);

        const dup = picked.some(
            p => sim(v[cands.indexOf(p)], v[i]) >
                (method === "tiny-ai" ? 0.7 : 0.4)
        );

        if (!dup && c.complete && (top.text + c.text).length < 380) {
            picked.push(c);
        }
    }

    const used = new Set();

    picked.forEach(p => {
        used.add(p.source);
        p.agreeing.forEach(s => used.add(s));
    });

    const order = [
        top.source,
        ...[...used].filter(s => s !== top.source)
    ];

    /* The writer's facts: the best few sentences,
       best first, skipping near-copies, capped at
       about 350 words. */

    const facts = [];
    let factWords = 0;

    for (const c of [...picked, ...ranked]) {
        if (facts.length >= 5) break;
        if (facts.includes(c)) continue;
        if (c !== top && c.score < top.score * 0.08) break;
        if (c !== top && c.rel < top.rel * 0.7) continue;

        const i = cands.indexOf(c);
        const dup = facts.some(
            p => sim(v[cands.indexOf(p)], v[i]) >
                (method === "tiny-ai" ? 0.88 : 0.6)
        );

        if (dup) continue;

        const n = words(c.text).length;

        if (facts.length && factWords + n > 350) continue;

        facts.push(c);
        factWords += n;
    }

    return {
        text: picked.map(p => p.text.replace(/([^.!?])$/, "$1.")).join(" "),
        facts: facts.map(c => c.text
            .replace(/\s+\d+\+\d+\u2044\d+\s*in\b/g, "")
            .replace(/\u2044/g, "/")
            .replace(/([^.!?])$/, "$1.")),
        factSources: [...new Set(facts.map(c => c.source))].map(s => sources[s]),
        sources: order.slice(0, 3).map(s => sources[s]),
        agreeCount: new Set([top.source, ...top.agreeing]).size,
        total: nSources,
        method
    };
}

/* =========================================
WEB SEARCH, STRAIGHT FROM YOUR BROWSER
========================================= */

const SEARCH_TIMEOUT = 5000;

function getJSON(url, ms) {
    const controller = new AbortController();
    const timer = setTimeout(
        () => controller.abort(),
        ms || SEARCH_TIMEOUT
    );

    return fetch(url, {
        signal: controller.signal,
        credentials: "omit"
    })
        .then(response => {
            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            return response.text();
        })
        .then(body => JSON.parse(body))
        .finally(() => clearTimeout(timer));
}

function stripTags(html) {
    const doc = new DOMParser().parseFromString(
        "<div>" + String(html || "") + "</div>",
        "text/html"
    );

    doc.querySelectorAll("pre, script, style").forEach(
        n => n.replaceWith(" ")
    );

    return (doc.body.textContent || "")
        .replace(/\s+/g, " ")
        .trim();
}

const TOPIC_DROP = new Set((
    "a an the of is are was were be been am do does did has have had " +
    "what who whom whose which when where why how many much tall old far big long wide deep high fast heavy large " +
    "please tell me you know can could would should will i want to there it its"
).split(" "));

const TOPIC_VERBS = new Set((
    "built build made make invented invent discovered discover founded found created create wrote write written " +
    "painted paint directed direct sang sing released release published publish started start happened happen died die born " +
    "live lives mean means called named located"
).split(" "));

function dropVerbs(topic) {
    const list = topic.split(" ");
    const kept = list.filter(w => !TOPIC_VERBS.has(w));

    return kept.length ? kept.join(" ") : topic;
}

function searchTopic(question) {
    return dropVerbs(rawTopic(question));
}

function rawTopic(question) {
    let t = question.toLowerCase()
        .replace(/[?!.]+$/, "")
        .replace(/^(please\s+)?(tell me|do you know|can you tell me|i want to know|i wonder)\s+/, "")
        .trim();

    const lead = t
        .replace(/^(what|who|whom|whose|where|when|why|which)\s+(is|are|was|were|did|does|do|has|have|can|will)\s+/, "")
        .replace(/^how\s+(many|much|tall|old|far|big|long|wide|deep|high|fast|heavy|large|hot|cold)\s+(is|are|was|were|does|do|did)\s+/, "")
        .replace(/^how\s+(is|are|was|were|does|do|did)\s+/, "")
        .replace(/^(what|who|which|where|when)\s+/, "")
        .replace(/^(is|are|was|were|did|does|do)\s+/, "")
        .replace(/^(the|a|an)\s+/, "")
        .trim();

    if (/\b(does|do|did|is|are|was|were|have|has)\b/.test(lead) || /^how /.test(lead)) {
        const after = lead.match(
            /\b(?:does|do|did|is|are|was|were|has|have)\s+(.+)$/
        );

        const subject = after
            ? (after[1].match(/[a-z0-9]+/g) || [])
                .filter(w => !TOPIC_DROP.has(w))
            : [];

        if (subject.length) {
            return subject.join(" ");
        }

        const kept = (lead.match(/[a-z0-9]+/g) || [])
            .filter(w => !TOPIC_DROP.has(w));

        if (kept.length) {
            return kept.join(" ");
        }
    }

    return lead || t || question;
}

/* Wikipedia search + article introductions. */

async function wikiSearch(lang, topic, howMany) {
    const base =
        "https://" + lang + ".wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*" +
        "&generator=search&gsrlimit=" + howMany +
        "&gsrsearch=" + encodeURIComponent(topic) +
        "&prop=extracts|pageprops&ppprop=wikibase_item&exintro=1&explaintext=1&exlimit=max&redirects=1";

    const data = await getJSON(base);
    const pages = (data.query && data.query.pages) || [];

    return pages
        .filter(p =>
            p.extract &&
            !/\(disambiguation\)/i.test(p.title) &&
            !/may (also )?refer to:?\s*$/.test(p.extract.trim())
        )
        .sort((a, b) => (a.index || 0) - (b.index || 0))
        .map(p => ({
            title: p.title,
            qid: p.pageprops && p.pageprops.wikibase_item,
            text: p.extract
                .replace(/\s*\(\s*[,;]?\s*\)/g, "")
                .slice(0, 3000),
            url: "https://" + lang +
                ".wikipedia.org/wiki/" +
                encodeURIComponent(p.title.replace(/ /g, "_"))
        }));
}

async function wikipediaSources(lang, label, topic, howMany) {
    try {
        const pages = await wikiSearch(lang, topic, howMany);

        return pages.map((p, i) => ({
            url: p.url,
            title: p.title,
            site: i === 0 ? label : label + " (" + p.title + ")",
            snippet: "",
            text: p.text,
            qid: p.qid
        }));
    } catch (error) {
        return [];
    }
}

/* DuckDuckGo Instant Answers */

async function duckDuckGoSources(topic) {
    try {
        const d = await getJSON(
            "https://api.duckduckgo.com/?q=" +
            encodeURIComponent(topic) +
            "&format=json&no_html=1&skip_disambig=1&t=eco"
        );

        const out = [];

        const main = [
            d.Answer,
            d.AbstractText,
            d.Definition
        ].filter(x => typeof x === "string" && x.trim()).join("\n");

        if (main) {
            out.push({
                url: d.AbstractURL ||
                    d.DefinitionURL ||
                    "https://duckduckgo.com/?q=" + encodeURIComponent(topic),
                title: d.Heading || topic,
                site: "DuckDuckGo",
                snippet: "",
                text: main
            });
        }

        const related = [];

        (d.RelatedTopics || []).forEach(t => {
            if (t.Text) {
                related.push(t);
            } else {
                (t.Topics || []).forEach(x => {
                    if (x.Text) related.push(x);
                });
            }
        });

        if (related.length) {
            out.push({
                url: related[0].FirstURL ||
                    "https://duckduckgo.com/?q=" + encodeURIComponent(topic),
                title: (d.Heading || topic) + " (related)",
                site: "DuckDuckGo (related)",
                snippet: related.slice(0, 4)
                    .map(t => t.Text.replace(/([^.!?])$/, "$1."))
                    .join("\n"),
                text: ""
            });
        }

        return out;
    } catch (error) {
        return [];
    }
}

/* Wikidata: short facts like heights, capitals and authors. */

const WIKIDATA_FACTS = [

    { p: "P50", when: /\b(wrote|written|write|author|writer)\b/, say: (s, v) => s + " was written by " + v + "." },
    { p: "P170", when: /\b(created|create|creator|made|painted|paint|drew)\b/, say: (s, v) => s + " was created by " + v + "." },
    { p: "P84", when: /\b(architect|designed|design)\b/, say: (s, v) => s + " was designed by " + v + "." },
    { p: "P61", when: /\b(invent|invented|inventor|discover|discovered)\b/, say: (s, v) => s + " was discovered or invented by " + v + "." },
    { p: "P112", when: /\b(founded|founder|found|start|started)\b/, say: (s, v) => s + " was founded by " + v + "." },
    { p: "P57", when: /\b(direct|directed|director)\b/, say: (s, v) => s + " was directed by " + v + "." },
    { p: "P175", when: /\b(sang|sing|singer|sings|performed|performer)\b/, say: (s, v) => s + " was performed by " + v + "." },
    { p: "P2048", when: /\b(tall|height|high)\b/, say: (s, v) => s + " is " + v + " tall." },
    { p: "P2043", when: /\b(long|length)\b/, say: (s, v) => s + " is " + v + " long." },
    { p: "P2067", when: /\b(heavy|weigh|weighs|weight|mass)\b/, say: (s, v) => s + " weighs " + v + "." },
    { p: "P2046", when: /\b(area|how big|size)\b/, say: (s, v) => s + " has an area of " + v + "." },
    { p: "P1082", when: /\b(population|how many people|people live)\b/, say: (s, v) => "The population of " + s + " is " + v + "." },
    { p: "P38", when: /\b(currency|money)\b/, say: (s, v) => "The currency of " + s + " is the " + v + "." },
    { p: "P37", when: /\blanguages?\b/, say: (s, v) => "The official language of " + s + " is " + v + "." },
    { p: "P35", when: /\b(president|king|queen|head of state)\b/, say: (s, v, q) => "The " + ((q.match(/\b(president|king|queen)\b/) || [])[1] || "head of state") + " of " + s + " is " + v + "." },
    { p: "P6", when: /\b(prime minister|mayor|governor|leader)\b/, say: (s, v, q) => "The " + ((q.match(/\b(prime minister|mayor|governor)\b/) || [])[1] || "leader") + " of " + s + " is " + v + "." },
    { p: "P569", when: /^(?!.*\bwhere\b).*\b(born|birthday|how old)\b/, say: (s, v) => s + " was born " + onIn(v) + "." },
    { p: "P19", when: /\bwhere\b.*\bborn\b/, say: (s, v) => s + " was born in " + v + "." },
    { p: "P570", when: /\b(die|died|death)\b/, say: (s, v) => s + " died " + onIn(v) + "." },
    { p: "P571", when: /\b(when was|what year|built|founded|opened|created|made)\b/, say: (s, v, q) => (/\b(built|build)\b/.test(q) ? "Building " + s + " began " : /\b(founded|found)\b/.test(q) ? s + " was founded " : s + " was started ") + onIn(v) + "." },
    { p: "P577", when: /\b(when was|what year|released|published|come out|came out)\b/, say: (s, v) => s + " came out " + onIn(v) + "." },
    { p: "P17", when: /\b(what country|which country|where is|where are)\b/, say: (s, v) => s + " is in the country of " + v + "." }
];

function onIn(date) {
    return (/^[A-Z][a-z]+ \d{1,2}, /.test(date) ? "on " : "in ") + date;
}

const UNITS = {
    Q11573: ["metre", "metres"],
    Q3710: ["foot", "feet"],
    Q828224: ["kilometre", "kilometres"],
    Q712226: ["square kilometre", "square kilometres"],
    Q11570: ["kilogram", "kilograms"],
    Q191118: ["tonne", "tonnes"],
    Q253276: ["mile", "miles"],
    Q174728: ["centimetre", "centimetres"],
    Q174789: ["millimetre", "millimetres"],
    Q218593: ["inch", "inches"],
    Q100995: ["pound", "pounds"],
    Q232291: ["square mile", "square miles"],
    Q11229: ["percent", "percent"],
    Q25343: ["square metre", "square metres"]
};

const MONTHS = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
];

function bestStatements(list) {
    const live = (list || []).filter(c =>
        c.rank !== "deprecated" &&
        c.mainsnak &&
        c.mainsnak.snaktype === "value" &&
        !(c.qualifiers && c.qualifiers.P582)
    );

    const preferred = live.filter(c => c.rank === "preferred");

    return (preferred.length ? preferred : live).slice(0, 3);
}

function wdValue(snak, labels) {
    const dv = snak.datavalue;

    if (!dv) return null;

    if (dv.type === "wikibase-entityid") {
        return labels[dv.value.id] || null;
    }

    if (dv.type === "quantity") {
        const n = Number(dv.value.amount);

        if (!Number.isFinite(n)) return null;

        const unitId = (dv.value.unit || "").split("/").pop();
        const unit = UNITS[unitId];
        const num = n.toLocaleString("en-US", {
            maximumFractionDigits: 2
        });

        if (unitId === "1" || !dv.value.unit || dv.value.unit === "1") {
            return num;
        }

        if (!unit) {
            return labels[unitId] ? num + " " + labels[unitId] : num;
        }

        return num + " " + (Math.abs(n) === 1 ? unit[0] : unit[1]);
    }

    if (dv.type === "time") {
        const m = String(dv.value.time).match(/^([+-])(\d+)-(\d\d)-(\d\d)/);

        if (!m) return null;

        const year = Number(m[2]) + (m[1] === "-" ? " BC" : "");
        const p = dv.value.precision;

        if (p >= 11 && m[3] !== "00" && m[4] !== "00") {
            return MONTHS[Number(m[3]) - 1] + " " + Number(m[4]) + ", " + year;
        }

        if (p === 10 && m[3] !== "00") {
            return MONTHS[Number(m[3]) - 1] + " " + year;
        }

        return String(year);
    }

    if (dv.type === "string") return dv.value;
    if (dv.type === "monolingualtext") return dv.value.text;

    return null;
}

function joinNames(list) {
    if (list.length <= 1) return list[0] || "";

    return list.slice(0, -1).join(", ") + " and " + list[list.length - 1];
}

async function wikidataLabels(ids) {
    const labels = {};
    const descriptions = {};

    const unique = [...new Set(ids)].filter(Boolean).slice(0, 50);

    if (!unique.length) {
        return { labels, descriptions };
    }

    const d = await getJSON(
        "https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*" +
        "&props=labels|descriptions&languages=en|mul&ids=" +
        unique.join("|")
    );

    for (const [id, e] of Object.entries(d.entities || {})) {
        const label = e.labels && (e.labels.en || e.labels.mul);

        if (label) labels[id] = label.value;

        if (e.descriptions && e.descriptions.en) {
            descriptions[id] = e.descriptions.en.value;
        }
    }

    return { labels, descriptions };
}

async function wikidataSearch(name) {
    const d = await getJSON(
        "https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*" +
        "&language=en&uselang=en&type=item&limit=1&search=" +
        encodeURIComponent(name)
    );

    return d.search && d.search[0] ? d.search[0].id : null;
}

async function wikidataSources(question, wikiPromise) {
    try {
        const q = question.toLowerCase();
        const wanted = WIKIDATA_FACTS.filter(f => f.when.test(q));
        const pages = await wikiPromise;
        const ids = pages.slice(0, 2).map(p => p.qid).filter(Boolean);

        const ofMatch = q
            .replace(/[?!.]+$/, "")
            .match(/\b(?:of|in|for)\s+(?:the\s+)?([a-z0-9 .'-]{3,40})$/);

        if (ofMatch && wanted.length) {
            try {
                const id = await wikidataSearch(ofMatch[1]);

                if (id) ids.unshift(id);
            } catch (error) {}
        }

        const entities = [...new Set(ids)].slice(0, 3);
        const mainId = pages[0] && pages[0].qid;

        if (!entities.length) return [];

        const claimsByEntity = {};

        await Promise.all(entities.map(async id => {
            claimsByEntity[id] = {};

            await Promise.all(wanted.slice(0, 4).map(async f => {
                try {
                    const d = await getJSON(
                        "https://www.wikidata.org/w/api.php?action=wbgetclaims&format=json&origin=*" +
                        "&entity=" + id + "&property=" + f.p
                    );

                    const list = bestStatements(d.claims && d.claims[f.p]);

                    if (list.length) {
                        claimsByEntity[id][f.p] = list;
                    }
                } catch (error) {}
            }));
        }));

        const needLabels = [...entities];

        for (const id of entities) {
            for (const list of Object.values(claimsByEntity[id])) {
                for (const c of list) {
                    const dv = c.mainsnak.datavalue;

                    if (dv && dv.type === "wikibase-entityid") {
                        needLabels.push(dv.value.id);
                    }

                    if (dv && dv.type === "quantity" && dv.value.unit) {
                        const u = dv.value.unit.split("/").pop();

                        if (/^Q\d+$/.test(u) && !UNITS[u]) {
                            needLabels.push(u);
                        }
                    }
                }
            }
        }

        const { labels, descriptions } = await wikidataLabels(needLabels);
        const out = [];

        const desc = (descriptions[mainId] || "")
            .replace(/\s*\([^()]*\)/g, "")
            .trim();

        if (
            mainId &&
            labels[mainId] &&
            desc &&
            !/^(wikimedia|disambiguation)/i.test(desc)
        ) {
            const article = /^(the|one of|any|some)\b/i.test(desc)
                ? ""
                : (/^[aeiou]/i.test(desc) ? "an " : "a ");

            out.push({
                url: "https://www.wikidata.org/wiki/" + mainId,
                title: labels[mainId],
                site: "Wikidata",
                snippet: "",
                text: labels[mainId] + " is " + article + desc + "."
            });
        }

        for (const id of entities) {
            const name = labels[id];

            if (!name) continue;

            const lines = [];

            for (const f of wanted) {
                const list = claimsByEntity[id][f.p];

                if (!list) continue;

                const values = [
                    ...new Set(
                        list.map(c => wdValue(c.mainsnak, labels)).filter(Boolean)
                    )
                ];

                if (values.length) {
                    lines.push(f.say(name, joinNames(values), q));
                }
            }

            if (lines.length) {
                out.push({
                    url: "https://www.wikidata.org/wiki/" + id,
                    title: name,
                    site: "Wikidata (facts)",
                    snippet: "",
                    text: lines.join("\n"),
                    direct: true
                });

                break;
            }
        }

        return out;
    } catch (error) {
        return [];
    }
}

/* Open Library: for questions about books. */

async function openLibrarySources(question, topic) {
    if (!/\b(wrote|written|write|author|writer|book|books|novel|poem|play)\b/i.test(question)) {
        return [];
    }

    try {
        const name = topic
            .replace(/\b(wrote|written|write|author|writer|book|novel|by|the book)\b/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        if (!name) return [];

        const d = await getJSON(
            "https://openlibrary.org/search.json?limit=3&fields=title,author_name,first_publish_year,key&q=" +
            encodeURIComponent(name)
        );

        const docs = (d.docs || []).filter(
            x => x.title && x.author_name && x.author_name.length
        );

        if (!docs.length) return [];

        const lines = docs.map(x =>
            "The book " + x.title +
            " was written by " + joinNames(x.author_name.slice(0, 2)) +
            (x.first_publish_year ? ", first published in " + x.first_publish_year : "") +
            "."
        );

        return [{
            url: "https://openlibrary.org" +
                (docs[0].key || "/search?q=" + encodeURIComponent(name)),
            title: docs[0].title,
            site: "Open Library",
            snippet: "",
            text: lines.join("\n")
        }];
    } catch (error) {
        return [];
    }
}

/* Stack Overflow: for coding questions. */

const CODE_WORDS = /\b(javascript|python|css|html|sql|php|typescript|reactjs|npm|git|github|bash|regex|json|c\+\+|c#|golang|kotlin|flexbox|programming|coding|code|syntax|compile|compiler)\b/i;
const MAYBE_CODE_WORDS = /\b(java|swift|rust|ruby|node|react|array|string|function|variable|loop|class|div|api|program|linux|exception|error|script|list|dictionary)\b/gi;

function looksLikeCode(question) {
    if (CODE_WORDS.test(question)) return true;

    return new Set(
        (question.match(MAYBE_CODE_WORDS) || []).map(w => w.toLowerCase())
    ).size >= 2;
}

async function stackOverflowSources(question) {
    if (!looksLikeCode(question)) return [];

    try {
        const d = await getJSON(
            "https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance" +
            "&accepted=True&pagesize=3&site=stackoverflow&q=" +
            encodeURIComponent(question)
        );

        const items = (d.items || [])
            .filter(i => i.accepted_answer_id)
            .slice(0, 3);

        if (!items.length) return [];

        const a = await getJSON(
            "https://api.stackexchange.com/2.3/answers/" +
            items.map(i => i.accepted_answer_id).join(";") +
            "?site=stackoverflow&filter=withbody"
        );

        const byId = new Map((a.items || []).map(x => [x.answer_id, x]));

        return items.map(i => {
            const ans = byId.get(i.accepted_answer_id);

            if (!ans) return null;

            return {
                url: "https://stackoverflow.com/a/" + i.accepted_answer_id,
                title: stripTags(i.title),
                site: "Stack Overflow",
                snippet: "",
                text: stripTags(ans.body).slice(0, 2000)
            };
        }).filter(Boolean);
    } catch (error) {
        return [];
    }
}

/* Wiktionary: definitions and word meanings. */

async function wiktionarySources(question) {
    const q = question.toLowerCase().replace(/[?!.]+$/, "").trim();

    const m =
        q.match(/^(?:define|definition of|meaning of|what is the meaning of|what is the definition of)\s+(?:the word\s+)?([a-z'-]+)$/) ||
        q.match(/^what does\s+(?:the word\s+)?([a-z'-]+)\s+mean$/);

    if (!m) return [];

    const word = m[1];

    try {
        const d = await getJSON(
            "https://en.wiktionary.org/api/rest_v1/page/definition/" +
            encodeURIComponent(word)
        );

        const lines = [];

        for (const entry of (d.en || []).slice(0, 2)) {
            for (const def of (entry.definitions || []).slice(0, 2)) {
                const text = stripTags(def.definition);

                if (text) {
                    lines.push(
                        word.charAt(0).toUpperCase() + word.slice(1) +
                        " (" + entry.partOfSpeech.toLowerCase() +
                        ") means: " + text.replace(/([^.!?])$/, "$1.")
                    );
                }
            }
        }

        if (!lines.length) return [];

        return [{
            url: "https://en.wiktionary.org/wiki/" + encodeURIComponent(word),
            title: word,
            site: "Wiktionary",
            snippet: "",
            text: lines.join("\n")
        }];
    } catch (error) {
        return [];
    }
}

async function webSearch(question) {
    const topic = searchTopic(question);
    const english = wikipediaSources("en", "Wikipedia", topic, 3);

    const all = await Promise.all([
        english,
        wikipediaSources("simple", "Simple Wikipedia", topic, 2),
        duckDuckGoSources(topic),
        wikidataSources(question, english),
        openLibrarySources(question, topic),
        stackOverflowSources(question),
        wiktionarySources(question)
    ].map(p => p.catch(() => [])));

    const sources = [].concat(...all).filter(
        s => s && (s.text || s.snippet)
    );

    return { q: question, topic, sources };
}

function addEcoAnswer(answer) {
    const { message, textElement } = createMessage("Eco");
    textElement.textContent = answer.text;

    const box = document.createElement("div");
    box.className = "sources";
    box.appendChild(document.createTextNode(
        answer.summarized ? "summarized from: " : "from: "
    ));

    const shown = new Set();

    answer.sources.forEach(src => {
        const label = String(src.site).replace(/\s*\(.*\)$/, "");

        if (shown.has(label)) return;

        if (shown.size) {
            box.appendChild(document.createTextNode(", "));
        }

        shown.add(label);

        const a = document.createElement("a");
        a.href = src.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = label;
        a.title = src.title || src.site;

        box.appendChild(a);
    });

    message.appendChild(box);

    if (answer.note) {
        const note = document.createElement("div");
        note.className = "ecoNote";
        note.textContent = answer.note;
        message.appendChild(note);
    }

    scrollDown();
}

function setThinkingText(text) {
    const el = document.querySelector("#thinkingMessage .messageText");

    if (el) {
        el.textContent = text;
        scrollDown();
    }
}

let lastAnswer = null;

async function ecoAnswer(question, currentRequest) {
    const askStart = performance.now();
    startBrain();
    startWriter();
    addThinking();
    setThinkingText("searching Wikipedia + DuckDuckGoâ¦");

    let data;

    try {
        data = await webSearch(question);
    } catch (error) {
        if (currentRequest !== requestNumber) return;

        removeThinking();
        webSearchReply(question);
        return;
    }

    if (currentRequest !== requestNumber) return;

    const sources = (data.sources || []).filter(
        s => (s.text || s.snippet)
    );

    if (!sources.length) {
        removeThinking();
        webSearchReply(question);
        return;
    }

    let useBrain = brainState === "ready";

    if (brainState === "loading") {
        setThinkingText(
            brainNoticeShown
                ? "thinkingâ¦"
                : "loading Ecoâs tiny brainâ¦ (only the first time)"
        );

        brainNoticeShown = true;
        useBrain = await waitForBrain(25000);

        if (currentRequest !== requestNumber) return;
    }

    setThinkingText("comparing " + sources.length + " sourcesâ¦");

    let answer = null;

    try {
        answer = await rankAnswer(question, sources, useBrain);
    } catch (error) {
        console.error("Eco ranking error:", error);

        try {
            answer = await rankAnswer(question, sources, false);
        } catch (e) {
            answer = null;
        }
    }

    if (currentRequest !== requestNumber) return;

    if (!answer) {
        removeThinking();
        webSearchReply(question);
        return;
    }

    /* The tiny writer turns the best sentences
       into a short answer. If it can't, the
       picked sentence stays as the answer. */

    const writeStart = performance.now();
    const written = await writeSummary(question, answer);

    if (currentRequest !== requestNumber) return;

    removeThinking();

    lastAnswer = {
        question,
        mode: written.text ? "writer" : "picked",
        why: written.why,
        raw: written.raw || "",
        picked: answer.text,
        facts: answer.facts,
        writeMs: Math.round(performance.now() - writeStart),
        totalMs: Math.round(performance.now() - askStart)
    };

    if (written.text) {
        const used = new Set();
        const list = [];

        for (const src of [...answer.sources, ...answer.factSources]) {
            if (src && !used.has(src)) {
                used.add(src);
                list.push(src);
            }
        }

        addEcoAnswer({
            ...answer,
            text: written.text,
            sources: list.slice(0, 4),
            summarized: true
        });
    } else {
        addEcoAnswer({
            ...answer,
            note: written.why === "still downloading"
                ? "Ecoâs writer is still downloading, so hereâs the best sentence for now."
                : ""
        });
    }
}

/* =========================================

========================================= */

async function askEco() {
    const text = input.value.trim();

    if (!text) {
        return;
    }

    input.value = "";
    input.focus();

    requestNumber++;
    const currentRequest = requestNumber;

    addUserMessage(text);
    addThinking();

    try {
        removeThinking();
        await handleCommand(text, currentRequest);
    } catch (error) {
        console.error("Eco command error:", error);
        removeThinking();

        addEcoMessage(
            "Something went wrong while processing that request. Please try again."
        );
    }
}
