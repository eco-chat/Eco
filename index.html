"use strict";

Answers come from the web. A tiny AI that runs

const input =

let waitingIndex = 0;
let timerInterval = null;

/* =========================================
ROTATING WELCOME TEXT
========================================= */

const waitingMessages = [
"How can I help you?",
"Go ahead, Iâ€™m listening.",
"You can type on the line below."
];

setInterval(() => {
welcome.classList.remove("swipe-in");
welcome.classList.add("swipe");

setTimeout(() => {
waitingIndex =
(waitingIndex + 1) % waitingMessages.length;

Text is inserted safely instead of being

function scrollDown() {

}

function createMessage(sender) {
const message = document.createElement("div");
message.className = "message";

const senderElement = document.createElement("div");
senderElement.className = "sender";
senderElement.textContent = sender;

const textElement = document.createElement("div");
textElement.className = "messageText";

message.append(senderElement, textElement);
conversation.appendChild(message);

return { message, textElement };
}

function addUserMessage(text) {
const { textElement } = createMessage("You");
textElement.textContent = text;
scrollDown();
}

function addEcoMessage(text) {
const { textElement } = createMessage("Eco");
textElement.textContent = String(text);
scrollDown();
}

function addEcoLinkMessage(prefix, label, url) {
const { textElement } = createMessage("Eco");

textElement.appendChild(
document.createTextNode(prefix)
);

const link = document.createElement("a");
link.className = "searchLink";
link.textContent = label;
link.href = url;
link.target = "_blank";
link.rel = "noopener noreferrer";

textElement.appendChild(link);
scrollDown();
}

function addEcoRichMessage(parts) {
const { textElement } = createMessage("Eco");

for (const part of parts) {
if (part.type === "link") {

link.href = part.url;
link.target = "_blank";
link.rel = "noopener noreferrer";
textElement.appendChild(link);

scrollDown();
}

/* =========================================
NORMALIZE COMMANDS
========================================= */

function normalize(text) {
return text
.toLocaleLowerCase()
.trim()
.replace(/[?!.,]+$/g, "")
.trim()
.replace(/\s+/g, " ");
}

/* =========================================
RANDOM NUMBER
========================================= */

function randomNumber() {
return Math.floor(Math.random() * 100) + 1;
}

/* =========================================
CALCULATOR
========================================= */

function calculateExpression(expression) {
const cleaned = expression
.replace(/,/g, "")
.trim();

if (!cleaned || cleaned.length > 100) {
return null;
}

/*
Permit only numeric arithmetic characters.
The expression is evaluated only after this
strict character check.
*/

if (!/^[0-9+\-*/().%\s]+$/.test(cleaned)) {
return null;
}

/*
Convert percentage values such as 50% into
50/100. This supports simple percentages,
not every possible interpretation of %.
*/

const converted = cleaned.replace(
/(\d+(?:\.\d+)?)\s*%/g,
"($1/100)"
);

try {
const result = Function(
'"use strict"; return (' + converted + ');'
)();

if (
typeof result !== "number" ||
!Number.isFinite(result)
) {
return null;
}

return Number(
result.toPrecision(12)
);
} catch {
return null;
}
}

function tryMath(command) {
let expression = command;

expression = expression
.replace(/^calculate\s+/i, "")
.replace(/^what is\s+/i, "")
.replace(/^what's\s+/i, "")
.replace(/\bplus\b/gi, "+")
.replace(/\bminus\b/gi, "-")
.replace(/\btimes\b/gi, "*")
.replace(/\bmultiplied by\b/gi, "*")
.replace(/\bdivided by\b/gi, "/")
.replace(/\bx\b/gi, "*")
.trim();

if (!/[0-9]/.test(expression)) {
return false;
}

const result = calculateExpression(expression);

if (result === null) {
return false;
}

addEcoMessage("The answer is " + result + ".");
return true;
}

/* =========================================
TIMER
========================================= */

function startTimer(minutes) {
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
}

const oldTimer =
document.getElementById("timerMessage");

if (oldTimer) {
oldTimer.remove();
}

timerEndTime =
Date.now() + minutes * 60 * 1000;

const { message, textElement } =
createMessage("Eco");

message.id = "timerMessage";

textElement.textContent =
"Timer set for " +
minutes +
" minute" +
(minutes === 1 ? "" : "s") +
".";

const display = document.createElement("div");
display.id = "timerDisplay";
display.className = "timerDisplay";
display.textContent = minutes + ":00";

message.appendChild(display);
scrollDown();

updateTimer();
timerInterval = setInterval(updateTimer, 250);
}

function updateTimer() {
if (timerEndTime === null) {
return;
}

const remaining =
Math.max(0, timerEndTime - Date.now());

const totalSeconds =
Math.ceil(remaining / 1000);

const minutes =
Math.floor(totalSeconds / 60);

const seconds =
totalSeconds % 60;

const display =
document.getElementById("timerDisplay");

if (display) {
display.textContent =
minutes + ":" +
String(seconds).padStart(2, "0");
}

if (remaining <= 0) {
clearInterval(timerInterval);
timerInterval = null;
timerEndTime = null;

if (display) {
display.textContent = "0:00";
}

addEcoMessage("Your timer is done!");

if ("Notification" in window) {
if (Notification.permission === "granted") {
new Notification("Eco", {
body: "Your timer is done!"
});
}
}
}
}

function cancelTimer() {
if (!timerInterval) {
return false;
}

clearInterval(timerInterval);
timerInterval = null;
timerEndTime = null;

const timer =
document.getElementById("timerMessage");

if (timer) {
timer.remove();
}

addEcoMessage("Timer cancelled.");
return true;
}

/* =========================================

function tryConversion(command) {
let match;
let value;
let result;

match = command.match(
/([\d.]+)\s*(miles?|mi)\s*(?:to|in)\s*(kilometers?|km)/
);

if (match) {
value = Number(match[1]);
result = value * 1.609344;

addEcoMessage(
value + " miles is " +
result.toFixed(2) + " kilometers."
);

return true;
}

match = command.match(
/([\d.]+)\s*(kilometers?|km)\s*(?:to|in)\s*(miles?|mi)/
);

if (match) {
value = Number(match[1]);
result = value / 1.609344;

addEcoMessage(
value + " kilometers is " +
result.toFixed(2) + " miles."
);

return true;
}

match = command.match(
/([\d.]+)\s*(?:degrees?\s*)?(?:fahrenheit|Â°f)\s*(?:to|in)\s*(?:celsius|Â°c)/
);

if (match) {
value = Number(match[1]);
result = (value - 32) * 5 / 9;

addEcoMessage(
value + "Â°F is " +
result.toFixed(1) + "Â°C."
);

return true;
}

match = command.match(
/([\d.]+)\s*(?:degrees?\s*)?(?:celsius|Â°c)\s*(?:to|in)\s*(?:fahrenheit|Â°f)/
);

if (match) {
value = Number(match[1]);
result = value * 9 / 5 + 32;

addEcoMessage(
value + "Â°C is " +
result.toFixed(1) + "Â°F."
);

return true;
}

match = command.match(
/([\d.]+)\s*(pounds?|lbs?)\s*(?:to|in)\s*(kilograms?|kg)/
);

if (match) {
value = Number(match[1]);
result = value * 0.45359237;

addEcoMessage(
value + " pounds is " +
result.toFixed(2) + " kilograms."
);

return true;
}

match = command.match(
/([\d.]+)\s*(kilograms?|kg)\s*(?:to|in)\s*(pounds?|lbs?)/
);

if (match) {
value = Number(match[1]);
result = value / 0.45359237;

addEcoMessage(
value + " kilograms is " +
result.toFixed(2) + " pounds."
);

return true;
}

match = command.match(
/([\d.]+)\s*(inches?|in)\s*(?:to|in)\s*(centimeters?|cm)/
);

if (match) {
value = Number(match[1]);
result = value * 2.54;

addEcoMessage(
value + " inches is " +
result.toFixed(2) + " centimeters."
);

return true;
}

match = command.match(
/([\d.]+)\s*(centimeters?|cm)\s*(?:to|in)\s*(inches?|in)/
);

if (match) {
value = Number(match[1]);
result = value / 2.54;

addEcoMessage(
value + " centimeters is " +
result.toFixed(2) + " inches."
);

return true;
}

return false;
}

/* =========================================
DAYS UNTIL A DATE
========================================= */

function tryDaysUntil(command) {
const match = command.match(
/^how many days (?:until|till)\s+(.+)$/
);

if (!match) {
return false;
}

const target = new Date(match[1]);

if (Number.isNaN(target.getTime())) {
return false;
}

const today = new Date();
today.setHours(0, 0, 0, 0);
target.setHours(0, 0, 0, 0);

const difference = Math.round(
(target - today) / 86400000
);

if (difference < 0) {
addEcoMessage("That date has already passed.");
} else if (difference === 0) {
addEcoMessage("That date is today! â˜€ï¸");
} else if (difference === 1) {
addEcoMessage("That date is tomorrow!");
} else {
addEcoMessage(
"There are " + difference +
" days until " +
target.toLocaleDateString(undefined, {
month: "long",
day: "numeric",
year: "numeric"
}) + "."
);
}

return true;
}

/* =========================================
ECO ANSWERS
1. The site's helper searches the web (Bing +
   Wikipedia) and reads the top pages.
2. A tiny AI in your browser (all-MiniLM-L6-v2,
   about 23 MB, cached after the first time) turns
   every sentence into numbers that capture meaning.
3. Each sentence scores high when it matches the
   question AND many different sites say the same
   thing. The winner is Eco's answer.
If the tiny AI can't load, Eco compares words instead.
========================================= */

let brain = null;
let brainState = "idle"; // idle | loading | ready | failed
let brainWaiters = [];
let brainJobs = new Map();
let brainJobId = 0;
let brainNoticeShown = false;

function startBrain() {
if (brain || brainState === "failed") return;
try {

const STOP = new Set(("a an the of to in on at for by with from and or but is are was were be been being am do does did " +
"what who whom whose which when where why how many much is it its it's this that these those there their they them " +
"he she his her him you your i me my we our us can could would should will shall may might must " +
"about into over than then so as if not no yes up out just also very more most some any all each " +
"tell give show find please know explain define meaning mean called name").split(" "));

const JUNK = /cookie|subscribe|sign up|sign in|log in|newsletter|advertis|privacy policy|terms of (use|service)|all rights reserved|Â©|javascript|your browser|click here|read more|download the app|follow us|share this|affiliate|we may earn|getty images|\bphoto:|image credit/i;

function words(text) {
return (text.toLowerCase().match(/[a-z0-9]+(?:['â€™][a-z]+)?/g) || [])
.map(w => w.replace(/['â€™]s$/, ""))
.map(w => (w.length > 4 && w.endsWith("s") && !w.endsWith("ss")) ? w.slice(0, -1) : w);
}

function keywords(text) {
return words(text).filter(w => !STOP.has(w) && w.length > 1);
}

function splitSentences(text) {
return text
.replace(/\s*\n+\s*/g, "\n")
.split(/\n|(?<=[.!?])\s+(?=["â€œ(]?[A-Z0-9])/)
.map(s => s.trim())
.filter(Boolean);
}

function cleanSentence(s) {
s = s.replace(/\s*\(([^()]*)\)/g, (m, inner) => (/[\/;ËˆËâ“˜]|listen|pronounc|^\s*[,;]?\s*$/i.test(inner) ? "" : m))
.replace(/\[\d+\]|\[citation needed\]/g, "")
.replace(/^[A-Z][a-z]{2} \d{1,2}, \d{4}\s*[Â·-]\s*/, "")
.replace(/\s*(â€¦|\.\.\.)$/, "")
.replace(/\s+/g, " ")
.trim()
.replace(/^(the )?(short |quick |simple )?answer( is)?:\s*/i, "")
.replace(/^(but|and|so|also|however|in fact|yes|well|actually|basically),?\s+/i, "");
return s.charAt(0).toUpperCase() + s.slice(1);
}

/* a snippet cut off mid-sentence ("...from Earth, which is") gets trimmed
   back to its last complete clause */
function trimCut(s) {
if (/[.!?"â€)]$/.test(s)) return s;
const comma = s.lastIndexOf(",");
if (comma > s.length * 0.5) return s.slice(0, comma);
const words = s.split(" ");
while (words.length > 5 && /^(which|that|is|are|was|were|the|a|an|and|or|of|to|in|on|at|for|with|by|its|their|it|as|from|but)$/i.test(words[words.length - 1])) words.pop();
return words.join(" ");
}

function buildCandidates(question, sources) {
const qk = new Set(keywords(question));
const out = [];

sources.forEach((src, si) => {
const pieces = [];
for (const s of splitSentences(src.text || "")) pieces.push({ text: s, snippet: false });
for (const s of splitSentences(src.snippet || "")) pieces.push({ text: s, snippet: true });

const seen = new Set();
const mine = [];

for (const p of pieces) {
let text = cleanSentence(p.text);
if (/^(what|how|why|who|when|where|which)\b/i.test(text) && text.length < 70) continue;
if (p.snippet) text = trimCut(text);
const n = words(text).length;
if (text.length < 25 || text.length > 360 || n < 5) continue;
if (JUNK.test(text)) continue;
if (/[{}<>|]/.test(text)) continue;
if (/\?$/.test(text)) continue;
const key = text.toLowerCase().slice(0, 80);
if (seen.has(key)) continue;
seen.add(key);
const kw = keywords(text);
let hits = 0;
for (const w of new Set(kw)) if (qk.has(w)) hits++;
mine.push({ text, source: si, kw, hits, snippet: p.snippet, complete: /[.!]$/.test(p.text.trim()) });
}

mine.sort((a, b) => b.hits - a.hits);
out.push(...mine.slice(0, 14));
});

/* keep it light for phones: best ~110 sentences */
out.sort((a, b) => b.hits - a.hits);
return out.slice(0, 110);
}

/* simple word vectors for when the tiny AI isn't there */
function wordVectors(texts) {
const df = new Map();
const docs = texts.map(t => {
const tf = new Map();
for (const w of keywords(t)) tf.set(w, (tf.get(w) || 0) + 1);
for (const w of tf.keys()) df.set(w, (df.get(w) || 0) + 1);
return tf;
});
const N = texts.length;
return docs.map(tf => {
const v = new Map();
let norm = 0;
for (const [w, c] of tf) {
const x = (1 + Math.log(c)) * Math.log(1 + N / df.get(w));
v.set(w, x);
norm += x * x;
}
norm = Math.sqrt(norm) || 1;
for (const [w, x] of v) v.set(w, x / norm);
return v;
});
}

function simWords(a, b) {
let s = 0;
const [small, big] = a.size < b.size ? [a, b] : [b, a];
for (const [w, x] of small) {
const y = big.get(w);
if (y) s += x * y;
}
return s;
}

function simDense(a, b) {
let s = 0;
for (let i = 0; i < a.length; i++) s += a[i] * b[i];
return s;
}

/* "answer words": numbers and names that aren't in the question.
   The ones that show up on the most different sites win the vote. */
function answerTokens(text, qWords) {
const tokens = new Set();
const nums = text.match(/\b\d[\d,.]*\b/g) || [];
for (const n of nums) {
const clean = n.replace(/[,.]$/, "").replace(/,/g, "");
if (clean.length && !qWords.has(clean)) tokens.add("#" + clean);
}
const caps = text.match(/\b[A-Z][a-zA-Zâ€™'-]{2,}\b/g) || [];
for (const c of caps) {
const w = words(c)[0];
if (w && !STOP.has(w) && !qWords.has(w)) tokens.add(w);
}
return tokens;
}

async function rankAnswer(question, sources, useBrain) {
const cands = buildCandidates(question, sources);
if (!cands.length) return null;

const texts = [question, ...cands.map(c => c.text)];
let vecs, sim, method;

if (useBrain) {
try {
vecs = await embed(texts);
sim = simDense;
method = "tiny-ai";
} catch (error) {
vecs = null;
}
}
if (!vecs) {
vecs = wordVectors(texts);
sim = simWords;
method = "word-match";
}

const q = vecs[0];
const v = vecs.slice(1);
const nSources = new Set(cands.map(c => c.source)).size;
const agreeAt = method === "tiny-ai" ? 0.62 : 0.28;

cands.forEach((c, i) => {
c.rel = Math.max(0, sim(q, v[i]));
});

/* vote: which answer words come up on the most sites
   (only counting sentences that are about the question) */
const rels = cands.map(c => c.rel).sort((a, b) => b - a);
const relCut = rels[Math.min(rels.length - 1, Math.floor(rels.length * 0.4))];
const qWords = new Set(words(question));
const ql = question.toLowerCase();
const wantsNumber = /\b(how (many|much|old|tall|far|long|big|high|deep|wide|fast|heavy|hot|cold)|what year|when|what is the (population|height|distance|age|temperature|boiling|melting|speed|weight|price|cost))\b/.test(ql);
const wantsName = !wantsNumber && /^(who|which|what is the (name|capital))\b/.test(ql);
const votes = new Map();
cands.forEach(c => {
c.tokens = answerTokens(c.text, qWords);
if (c.rel < relCut) return;
for (const t of c.tokens) {
if (!votes.has(t)) votes.set(t, new Set());
votes.get(t).add(c.source);
}
});

cands.forEach((c, i) => {
/* agreement: how many OTHER sites have a sentence that says the same thing */
const best = new Map();
cands.forEach((d, j) => {
if (d.source === c.source) return;
const s = sim(v[i], v[j]);
if (s > (best.get(d.source) || 0)) best.set(d.source, s);
});
let agree = 0;
c.agreeing = [];
for (const [src, s] of best) {
if (s >= agreeAt) {
agree += s;
c.agreeing.push(src);
}
}
c.agree = nSources > 1 ? agree / (nSources - 1) : 0;

let vote = 0;
for (const t of c.tokens) {
const n = votes.has(t) ? votes.get(t).size : 0;
if (n >= 2) vote = Math.max(vote, n / nSources);
}
c.vote = vote;

/* what kind of answer the question wants */
let kind = 1;
if (wantsNumber) kind = /\d/.test(c.text) ? 1.25 : 0.55;
else if (wantsName) kind = [...c.tokens].some(t => t[0] !== "#") ? 1.1 : 0.7;

const lengthPenalty = c.text.length > 240 ? 0.85 : 1;
const partial = c.complete ? 1 : (c.snippet ? 0.9 : 0.6);
c.score = Math.pow(c.rel, 1.5) * (0.35 + c.agree) * (0.7 + vote) * kind * lengthPenalty * partial;
});

const ranked = [...cands].sort((a, b) => b.score - a.score);
const top = ranked[0];
if (!top || top.rel < (method === "tiny-ai" ? 0.25 : 0.05)) return null;

const picked = [top];
for (const c of ranked.slice(1, 12)) {
if (picked.length >= 2) break;
if (c.score < top.score * 0.75) break;
const i = cands.indexOf(c);
const dup = picked.some(p => sim(v[cands.indexOf(p)], v[i]) > (method === "tiny-ai" ? 0.7 : 0.4));
if (!dup && c.complete && (top.text + c.text).length < 380) picked.push(c);
}

const used = new Set();
picked.forEach(p => { used.add(p.source); p.agreeing.forEach(s => used.add(s)); });
const order = [top.source, ...[...used].filter(s => s !== top.source)];

return {
text: picked.map(p => p.text.replace(/([^.!?])$/, "$1.")).join(" "),
sources: order.slice(0, 3).map(s => sources[s]),
agreeCount: new Set([top.source, ...top.agreeing]).size,
total: nSources,
method
};
}

}

/* UNIT CONVERSIONS */

if (tryConversion(command)) {
return true;
}

/* DAYS UNTIL */

if (tryDaysUntil(command)) {
return true;
}

/* MATH */

if (
command.startsWith("calculate ") ||
command.startsWith("what is ") ||
command.startsWith("what's ")
) {
if (tryMath(command)) {
return true;
}
}

/* WEB SEARCH */

const searchPrefixes = [
"search the web for ",
"search for ",
"google ",
"look up ",
"find "
];

for (const prefix of searchPrefixes) {
if (command.startsWith(prefix)) {
const query = text.trim().slice(prefix.length).trim();

if (query) {
await ecoAnswer(query, currentRequest);
} else {
addEcoMessage("What would you like me to search for?");
}

return true;
}
}

/* OPEN WEBSITES */

const websites = {
"open google": "https://www.google.com",
"open youtube": "https://www.youtube.com",
"open wikipedia": "https://www.wikipedia.org"
};

if (websites[command]) {
window.open(
websites[command],
"_blank",
"noopener,noreferrer"
);

addEcoMessage(
"Opening " +
command.replace("open ", "") + "."
);

return true;
}

/* EVERYTHING ELSE: SEARCH THE WEB + TINY AI */

await ecoAnswer(text, currentRequest);
return true;
}

/* =========================================
SEND MESSAGE
========================================= */

async function askEco() {
const text = input.value.trim();

if (!text) {
return;
}

input.value = "";
input.focus();

requestNumber++;
const currentRequest = requestNumber;

addUserMessage(text);
addThinking();

try {
removeThinking();
await handleCommand(text, currentRequest);
} catch (error) {
console.error("Eco command error:", error);
removeThinking();

addEcoMessage(
"Something went wrong while processing that request. Please try again."
);
}
}

/* =========================================
FORM SUBMISSION
========================================= */

document
.getElementById("inputForm")
.addEventListener("submit", function(event) {
event.preventDefault();
askEco();
});

</script>
